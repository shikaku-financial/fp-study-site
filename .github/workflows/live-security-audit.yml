name: FP Lab live security audit

on:
  push:
    branches: [main]
    paths:
      - '_headers'
      - '*.html'
      - '.ci/live-security-audit.cjs'
      - '.github/workflows/live-security-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fp-live-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-security-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check audit code syntax
        run: node --check .ci/live-security-audit.cjs
      - name: Verify public HTTPS security headers
        run: node .ci/live-security-audit.cjs
