name: Publish FP Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'info.css'
      - 'sitemap.xml'
      - 'style.css'
      - 'app.js'
      - 'questions.js'
      - 'practical.js'
      - 'practical-questions.js'
      - 'practical-materials.js'
      - 'financial-license-lab-logo.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble site files
        run: |
          mkdir -p _site
          cp index.html style.css app.js questions.js practical.js practical-questions.js practical-materials.js financial-license-lab-logo.png _site/
          cp about.html privacy.html contact.html guide.html fp3-study.html practical-tracks.html info.css sitemap.xml _site/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
