name: Publish FP Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'info.css'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'style.css'
      - 'app.js'
      - 'boki*.js'
      - 'boki.css'
      - 'boki.webmanifest'
      - 'questions.js'
      - 'practical.js'
      - 'practical-questions.js'
      - 'practical-materials.js'
      - 'financial-license-lab-logo.png'
      - 'apple-touch-icon.png'
      - 'favicon-32x32.png'
      - 'favicon.ico'
      - 'site.webmanifest'
      - 'ads.txt'
      - '_headers'
      - '.github/workflows/pages.yml'
      - '.ci/build-static.cjs'
      - '.ci/security-check.cjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned 2026-10-23
        with:
          persist-credentials: false
      - name: Validate security headers and static policies
        run: node .ci/security-check.cjs
      - name: Assemble the shared static output
        run: node .ci/build-static.cjs
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5, pinned 2026-10-23
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4, pinned 2026-10-23
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4, pinned 2026-10-23
