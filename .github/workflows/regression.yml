name: FP Lab regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fp-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-18
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, resolved 2026-10-18
        with:
          node-version: '24'
      - name: Check syntax, IDs, grading and historical storage
        run: node .ci/run.cjs
