name: FP Lab regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fp-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-10-18
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, resolved 2026-10-18
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check syntax, IDs, grading and historical storage
        run: node .ci/run.cjs
      - name: Check bookkeeping grading and original datasets
        run: |
          node --check boki-extra.js
          node .ci/boki-check.cjs
          node .ci/boki-second-check.cjs
          node .ci/boki-flow-check.cjs
      - name: Check shared learning calculator
        run: |
          node --check calculator.js
          node .ci/calculator-check.cjs
      - name: Check FLL parent routes and brand contracts
        run: node .ci/fll-check.cjs
      - name: Check static search landing pages and sitemap
        run: node .ci/seo-pages-check.cjs
      - name: Check deployed audit syntax
        run: node --check .ci/live-security-audit.cjs
      - name: Validate site security policies and GitHub workflow hardening
        run: node .ci/security-check.cjs
      - name: Validate Cloudflare-ready public output
        run: node .ci/build-static.cjs
